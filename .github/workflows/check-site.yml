name: Vérifications du site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-site:
    name: Tests et liens du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test
      - run: node outils/etiquettes-tracabilite/tests/run.mjs
      - run: python scripts/check-site.py

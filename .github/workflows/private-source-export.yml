name: ORBIVIA offline source archive
on:
  pull_request:
    branches: [main]
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ORBIVIA_Compliance_Studio_offline
          path: |
            outils/compliance/
            tests/compliance.test.cjs
            tests/compliance-models.test.cjs
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
